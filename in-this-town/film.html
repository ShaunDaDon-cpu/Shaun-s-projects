<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 1080, H = 1920, FPS = 60;
const DATA = await (await fetch('shots.json')).json();
await document.fonts.load('700 74px Fredoka');

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 600);

const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa66, 1.4);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(hemi, sun, sun.target);

// ---------- helpers ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const seg = (t, a, b) => clamp((t - a) / (b - a));

const matCache = new Map();
function M(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, ...o }));
  return matCache.get(key);
}
const geoCache = new Map();
function RB(w, h, d, r = 0.08) {
  const key = [w, h, d, r].join(',');
  if (!geoCache.has(key)) geoCache.set(key, r > 0 ? new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.01, h / 2.01, d / 2.01)) : new THREE.BoxGeometry(w, h, d));
  return geoCache.get(key);
}
function box(w, h, d, color, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(RB(w, h, d, o.r ?? 0.08), o.mat || M(color, o.m || {}));
  m.position.set(x, y, z);
  m.castShadow = o.cast ?? true; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, color, seg = 20, o = {}) {

  m.castShadow = true; m.receiveShadow = true; return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function studTex(color, light = 0.12) {
  return canvasTex(128, 128, (g) => {
    const c = new THREE.Color(color);
    g.fillStyle = '#' + c.getHexString(); g.fillRect(0, 0, 128, 128);
    const hi = c.clone().offsetHSL(0, 0, light), lo = c.clone().offsetHSL(0, 0, -light * 0.8);
    for (const [x, y] of [[32, 32], [96, 32], [32, 96], [96, 96]]) {
      g.fillStyle = '#' + lo.getHexString(); g.beginPath(); g.arc(x + 3, y + 4, 19, 0, 7); g.fill();
      g.fillStyle = '#' + hi.getHexString(); g.beginPath(); g.arc(x, y, 18, 0, 7); g.fill();
      g.fillStyle = '#' + c.getHexString(); g.beginPath(); g.arc(x + 1, y + 1, 13, 0, 7); g.fill();
    }
  });
}
function plate(w, d, color, x = 0, y = 0, z = 0, studs = true, rep = 0.5) {

    const t = studTex(color); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(w * rep, d * rep);
    mat = new THREE.MeshStandardMaterial({ map: t, roughness: 0.6 });

}
function sign(lines, w, h, o = {}) {
  const px = 180;
  const tex = canvasTex(Math.round(w * px), Math.round(h * px), (g, cw, ch) => {
    g.fillStyle = o.bg || '#fff'; g.fillRect(0, 0, cw, ch);
    if (o.border !== false) { g.strokeStyle = o.bc || '#111'; g.lineWidth = ch * 0.06; g.strokeRect(0, 0, cw, ch); }
    const L = Array.isArray(lines) ? lines : [lines];
    const sizes = o.sizes || L.map(() => ch * 0.7 / L.length);
    let total = sizes.reduce((a, b) => a + b * 1.1, 0), y = (ch - total) / 2;
    L.forEach((s, i) => {
      g.font = `700 ${sizes[i]}px Fredoka`; g.textAlign = 'center'; g.textBaseline = 'top';
      let fs = sizes[i]; while (g.measureText(s).width > cw * 0.9 && fs > 10) { fs -= 2; g.font = `700 ${fs}px Fredoka`; }
      g.fillStyle = (o.colors && o.colors[i]) || o.fg || '#111';
      g.fillText(s, cw / 2, y + (sizes[i] - fs) / 2 + sizes[i] * 0.08); y += sizes[i] * 1.1;
    });
  });
  const mat = o.glow ? new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }) : new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);

}
function skyTex(top, bottom) {
  return canvasTex(4, 256, (g) => { const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); });
}
const SKY = {
  day: skyTex('#4fa3ea', '#f3dcc2'), sunset: skyTex('#5b3a9c', '#ff9a4d'), night: skyTex('#070b26', '#1d2a66'),
  studioPink: skyTex('#ffb3d1', '#ffe0ec'), mist: skyTex('#8c98aa', '#c3ccd6'), dark: skyTex('#050505', '#151515'), warm: skyTex('#2a1a12', '#3a2416'),
};

// ---------- faces ----------
const faceCache = new Map();
function faceTex(expr, open, flags = '') {

    g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111'; g.fillStyle = '#111';
    const L = 92, R = 164, EY = 112;
    const eye = (x, y = EY, rx = 13, ry = 21) => { g.fillStyle = '#111'; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 4, y - 8, 5, 0, 7); g.fill(); };

    const xeye = (x) => { g.lineWidth = 9; g.beginPath(); g.moveTo(x - 13, EY - 13); g.lineTo(x + 13, EY + 13); g.moveTo(x + 13, EY - 13); g.lineTo(x - 13, EY + 13); g.stroke(); };
    const squeeze = (x, dir) => { g.lineWidth = 9; g.beginPath(); g.moveTo(x - 13 * dir, EY - 12); g.lineTo(x + 11 * dir, EY); g.lineTo(x - 13 * dir, EY + 12); g.stroke(); };
    const heart = (x) => { g.fillStyle = '#ff2d6f'; g.beginPath(); g.moveTo(x, EY + 18); g.bezierCurveTo(x - 30, EY - 2, x - 14, EY - 26, x, EY - 10); g.bezierCurveTo(x + 14, EY - 26, x + 30, EY - 2, x, EY + 18); g.fill(); };
    const brow = (x1, y1, x2, y2) => { g.lineWidth = 9; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
    const mouths = {
      smile: () => { g.lineWidth = 9; g.beginPath(); g.arc(128, 148, 32, Math.PI * 0.18, Math.PI * 0.82); g.stroke(); },
      grin: () => { g.fillStyle = '#111'; g.beginPath(); g.moveTo(86, 156); g.lineTo(170, 156); g.quadraticCurveTo(168, 212, 128, 212); g.quadraticCurveTo(88, 212, 86, 156); g.fill();
        g.fillStyle = '#fff'; g.fillRect(96, 160, 64, 12); g.fillStyle = '#ff6b8b'; g.beginPath(); g.ellipse(128, 200, 20, 9, 0, 0, 7); g.fill(); },
      frown: () => { g.lineWidth = 9; g.beginPath(); g.arc(128, 204, 30, Math.PI * 1.2, Math.PI * 1.8); g.stroke(); },
      flat: () => { g.lineWidth = 9; g.beginPath(); g.moveTo(108, 180); g.lineTo(150, 182); g.stroke(); },
      sulk: () => { g.lineWidth = 9; g.beginPath(); g.moveTo(106, 186); g.quadraticCurveTo(128, 174, 152, 184); g.stroke(); },
      O: () => { g.fillStyle = '#111'; g.beginPath(); g.ellipse(128, 182, 15, 20, 0, 0, 7); g.fill(); },
      bigO: () => { g.fillStyle = '#111'; g.beginPath(); g.ellipse(128, 186, 24, 30, 0, 0, 7); g.fill(); g.fillStyle = '#ff6b8b'; g.beginPath(); g.ellipse(128, 204, 14, 8, 0, 0, 7); g.fill(); },
      smirk: () => { g.lineWidth = 9; g.beginPath(); g.moveTo(104, 178); g.quadraticCurveTo(140, 188, 160, 164); g.stroke(); },
      grit: () => { g.fillStyle = '#fff'; g.strokeStyle = '#111'; g.lineWidth = 7; g.beginPath(); g.roundRect(94, 164, 68, 32, 8); g.fill(); g.stroke(); g.beginPath(); g.moveTo(94, 180); g.lineTo(162, 180); for (const x of [111, 128, 145]) { g.moveTo(x, 164); g.lineTo(x, 196); } g.stroke(); },
      wavy: () => { g.lineWidth = 8; g.beginPath(); g.moveTo(102, 184); for (let i = 1; i <= 6; i++) g.lineTo(102 + i * 9, 184 + (i % 2 ? -7 : 7)); g.stroke(); },
      tongue: () => { g.lineWidth = 9; g.beginPath(); g.moveTo(104, 176); g.lineTo(152, 176); g.stroke(); g.fillStyle = '#ff6b8b'; g.beginPath(); g.ellipse(138, 190, 12, 14, 0, 0, 7); g.fill(); g.stroke(); },
      talk: () => { g.fillStyle = '#111'; g.beginPath(); g.ellipse(128, 180, 22, 15, 0, 0, 7); g.fill(); g.fillStyle = '#ff6b8b'; g.beginPath(); g.ellipse(128, 189, 12, 6, 0, 0, 7); g.fill(); },
    };
    const E = {
      neutral: { e: 'n', m: 'smile' }, happy: { e: 'n', m: 'grin', b: 'up' }, joy: { e: 'c', m: 'grin', b: 'up', blush: 1 },
      sad: { e: 'n', m: 'frown', b: 'sad' }, cry: { e: 'n', m: 'frown', b: 'sad', tears: 1 }, sob: { e: 'c2', m: 'bigO', b: 'sad', tears: 1 },
      angry: { e: 'n', m: 'grit', b: 'angry' }, fume: { e: 'n', m: 'frown', b: 'angry' }, shocked: { e: 'w', m: 'bigO', b: 'high' },
      brood: { e: 'l', m: 'sulk', b: 'flat' }, tired: { e: 'l', m: 'wavy', b: 'sad', bags: 1 }, dead: { e: 'x', m: 'tongue' },
      deadwink: { e: 'xw', m: 'smirk' }, wink: { e: 'w1', m: 'smirk', b: 'up' }, smug: { e: 'l', m: 'smirk', b: 'flat' },
      determined: { e: 'n', m: 'smirk', b: 'angry' }, hearts: { e: 'h', m: 'grin', blush: 1 }, cough: { e: 'sq', m: 'bigO', b: 'sad' },
      sheepish: { e: 'n', m: 'smile', b: 'sad', blush: 1 }, drama: { e: 'n', m: 'O', b: 'sad' }, cool: { e: 'n', m: 'flat' },
      faint: { e: 'x', m: 'O', tears: 1 },

    if (E.bags) { g.strokeStyle = 'rgba(90,60,120,.55)'; g.lineWidth = 6; for (const x of [L, R]) { g.beginPath(); g.arc(x, EY + 18, 13, 0.2, Math.PI - 0.2); g.stroke(); } g.strokeStyle = '#111'; }
    switch (E.e) {
      case 'n': eye(L); eye(R); break;
      case 'w': eye(L, EY, 17, 25); eye(R, EY, 17, 25); break;
      case 'l': lid(L); lid(R); break;
      case 'c': closed(L); closed(R); break;
      case 'c2': closed(L, false); closed(R, false); break;
      case 'x': xeye(L); xeye(R); break;
      case 'xw': xeye(L); eye(R); break;
      case 'w1': eye(L); closed(R); break;
      case 'h': heart(L); heart(R); break;
      case 'sq': squeeze(L, 1); squeeze(R, -1); break;

      case 'up': brow(76, 76, 106, 70); brow(150, 70, 180, 76); break;
      case 'sad': brow(74, 80, 108, 68); brow(148, 68, 182, 80); break;
      case 'angry': brow(74, 70, 110, 86); brow(146, 86, 182, 70); break;
      case 'high': brow(76, 62, 108, 58); brow(148, 58, 180, 62); break;
      case 'flat': brow(74, 82, 110, 84); brow(146, 84, 182, 82); break;
    }
    if (flags.includes('g')) { g.strokeStyle = '#6b3fa0'; g.lineWidth = 6; g.beginPath(); g.arc(L, EY, 26, 0, 7); g.moveTo(R + 26, EY); g.arc(R, EY, 26, 0, 7); g.moveTo(L + 26, EY); g.lineTo(R - 26, EY); g.stroke(); g.strokeStyle = '#111'; }
    if (flags.includes('s')) { g.fillStyle = '#0d0d0d'; g.beginPath(); g.roundRect(60, 92, 60, 40, 10); g.roundRect(136, 92, 60, 40, 10); g.fill(); g.fillRect(118, 100, 20, 8); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(70, 98, 16, 8); g.fillRect(146, 98, 16, 8); }
    if (E.blush) { g.fillStyle = 'rgba(255,90,120,.45)'; g.beginPath(); g.ellipse(62, 150, 18, 10, 0, 0, 7); g.ellipse(194, 150, 18, 10, 0, 0, 7); g.fill(); }

}

// ---------- characters ----------
const SKIN = { a: 0xf2c79b, b: 0xc98a5e, c: 0x8d5a3b, d: 0xffd98a };
function makeChar(o) {

  const body = new THREE.Group(); c.add(body);
  const shirt = o.shirt, pants = o.pants ?? 0x333a55, skin = o.skin ?? SKIN.a;
  const torso = box(2, 2, 1, shirt, 0, 3, 0); body.add(torso);
  const neck = new THREE.Group(); neck.position.set(0, 4, 0); body.add(neck);
  const head = box(1.2, 1.2, 1.2, skin, 0, 0.62, 0, { r: 0.22 }); neck.add(head);
  const faceMat = new THREE.MeshStandardMaterial({ map: faceTex(o.face || 'neutral', false, o.flags), transparent: true, roughness: 0.7, depthWrite: false });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), faceMat); face.position.set(0, 0.62, 0.605); neck.add(face);
  const mkLimb = (x, y, color, end) => {
    const p = new THREE.Group(); p.position.set(x, y, 0); body.add(p);
    p.add(box(1, end ? 1.45 : 2, 1, color, 0, end ? -0.725 : -1, 0));

    const hand = new THREE.Group(); hand.position.set(0, -2, 0); p.add(hand);

  const la = mkLimb(1.5, 4, sleeve, skin), ra = mkLimb(-1.5, 4, sleeve, skin);
  la.children[0].position.y -= 0; // arms pivot at shoulder
  la.position.y = ra.position.y = 4; // shoulder
  // shift arm meshes so pivot is at top

    case 'linda': H(1.36, 0.36, 1.36, 0, 1.3, 0); H(1.4, 1.5, 0.3, 0, 0.45, -0.6); H(0.22, 1.2, 1.2, 0.7, 0.55, -0.05); H(0.22, 1.2, 1.2, -0.7, 0.55, -0.05); H(0.7, 0.22, 0.3, -0.3, 1.13, 0.56, hc, 0, 0.25); break;

      H(0.3, 0.3, 0.3, 0.72, 1.0, 0, 0xff3d8b); H(0.3, 0.3, 0.3, -0.72, 1.0, 0, 0xff3d8b); break;

B[29] = () => { const root = buildWarehouse(); const hs = []; const r = rng(4); for (let i = 0; i < 14; i++) { const h = emptyHoodie(i); h.position.set((r() - 0.5) * 30, 0, -2 + (r() - 0.5) * 14); root.add(h); hs.push(h); }
  for (let i = 0; i < 4; i++) { const h = emptyHoodie(50 + i); h.position.set(-6 + i * 5, 2.5, -4.5); root.add(h); }
  const f = family(root, 2, 7, 3.4); const smoke = bubbles(24, 12, [30, 14, 16], 0xd8dce4); smoke.position.set(0, 0, 0); root.add(smoke);
  return { root, light: 'warehouse', cam: (t, u) => camLerp(K([2, 16, 26], [1, 2, 0], 50), K([2, 10, 20], [1, 3, 2], 50), u),
    update: (t) => { smoke.update(t * 0.3, 0); smoke.items.forEach(s => s.scale.multiplyScalar(4)); const cheer = t > 0.8; ['bev', 'dale', 'linda', 'tess'].forEach((k, i) => { const c = f[k]; const h = cheer ? Math.abs(Math.sin(t * 7 + i)) * 0.6 : 0; c.pose(cheer ? { lax: -2.9, rax: -2.9, laz: 0.4, raz: 0.4, bob: h } : { lax: -0.2, rax: -0.2 }); c.setFace(cheer ? 'joy' : 'shocked'); }); } }; };
// 31 coffee shop
B[30] = () => { const root = buildCoffee(); const r = CAST.rob(7, 'sheepish', { apron: true }); r.position.set(1.2, 0, -2.2); root.add(r); const d = CAST.dale(); d.position.set(-1.4, 0, 2.6); d.rotation.y = Math.PI * 0.8; root.add(d); const cp = cup(); root.add(cp);
  return { root, light: 'kitchen', cam: (t, u) => camLerp(K([1.0, 6.2, 12], [0, 4.8, 0], 46), K([0.8, 6.0, 10.8], [0, 4.8, 0], 46), u),
    update: (t) => { const k = ease(seg(t, 0.4, 1.4)); r.pose({ rax: lerp(-0.4, -1.5, k), raz: 0.15, hz: -0.1 }); r.setFace('sheepish'); cp.position.set(lerp(0.8, -0.6, k), 4.35 + Math.sin(k * Math.PI) * 0.3, lerp(-0.6, 1.4, k));
      d.pose({ lax: -1.3 * seg(t, 1.0, 1.6), laz: 0.2, raz: 0.6 * Math.max(0, Math.sin(seg(t, 1.8, 2.8) * Math.PI)), rax: -0.3 }); d.setFace(t > 1.9 ? 'smug' : 'neutral'); } }; };
// 32 finale
B[31] = () => { const root = buildTown('sunset', { sign: true, clear: x => Math.abs(x) < 8 }); const f = family(root, 0, 2, 3.4); const ppl = []; for (let i = 0; i < 8; i++) { const c = CAST.towny(i); c.position.set(-16 + (i % 4) * 3.6 + (i >= 4 ? 21 : 0), 0, 4 - (i % 2) * 1.6); root.add(c); ppl.push(c); }
  const cof = CAST.rob(7, 'sheepish', { apron: true }); cof.position.set(10, 0, -2); root.add(cof);
  const cf = confetti(160, 21, [40, 22, 14]); cf.position.z = 2; root.add(cf);
  return { root, light: 'sunset', cam: (t, u) => camLerp(K([0, 4.2, 13], [0, 4, 2], 48), K([0, 20, 42], [0, 6, -6], 50), u),
    update: (t) => { const bow = Math.max(0, Math.sin(seg(t, 0.2, 1.4) * Math.PI)); ['bev', 'dale', 'linda', 'tess'].forEach((k, i) => { const c = f[k]; c.pose(t < 1.4 ? { bx: bow * 0.6, lax: -0.3, rax: -0.3 } : { lax: -2.9, rax: -2.9, laz: 0.3, raz: 0.3, bob: Math.abs(Math.sin(t * 6 + i)) * 0.4 }); c.setFace(t < 1.4 ? 'happy' : 'joy'); });
      ppl.forEach((c, i) => { c.pose({ rax: -2.8, raz: 0.3, lax: -0.2, bob: Math.abs(Math.sin(t * 6 + i)) * 0.3 }); c.setFace(i % 2 ? 'joy' : 'happy'); }); cof.pose({ rax: -2.6, raz: 0.4 + Math.sin(t * 8) * 0.3 }); cf.update(t, 22); } }; };


// ---------- film crew gear ----------
function stick(a, b, r, color) { const d = b.clone().sub(a); const m = cyl(r, r, d.length(), color, 8); m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); return m; }
function filmCam() {
  const g = new THREE.Group(); const H = 3.4;
  for (let k = 0; k < 3; k++) { const a = k / 3 * Math.PI * 2 + 0.5; g.add(stick(V(0, H, 0), V(Math.cos(a) * 1.3, 0, Math.sin(a) * 1.3), 0.07, 0x2a2a2e)); }
  g.add(box(0.6, 0.35, 0.6, 0x2a2a2e, 0, H + 0.15, 0));
  g.add(box(1.0, 1.1, 1.9, 0x1c1c20, 0, H + 0.9, -0.1, { r: 0.12 }));
  const lens = cyl(0.33, 0.38, 0.9, 0x111114, 16); lens.rotation.x = Math.PI / 2; lens.position.set(0, H + 0.9, 1.25); g.add(lens);
  const glass = cyl(0.27, 0.27, 0.05, 0x3a6aa8, 16, { m: { roughness: 0.05, metalness: 0.6 } }); glass.rotation.x = Math.PI / 2; glass.position.set(0, H + 0.9, 1.71); g.add(glass);
  g.add(box(1.3, 1.0, 0.12, 0x111114, 0, H + 0.9, 1.75, { r: 0.04 }));
  for (const z of [-0.65, 0.35]) { const rl = cyl(0.55, 0.55, 0.25, 0x2a2a2e, 20); rl.rotation.z = Math.PI / 2; rl.position.set(0, H + 1.95, z); g.add(rl); }
  g.add(box(0.15, 0.15, 0.15, 0xff2020, 0.42, H + 1.35, 0.6, { m: { emissive: 0xff0000, emissiveIntensity: 2 } }));
  g.add(box(0.7, 0.5, 0.08, 0x111111, -0.62, H + 1.0, -0.4).rotateY(-0.9));
  return g;
}
function boomMic() {
  const g = new THREE.Group();
  const fuzz = cyl(0.32, 0.32, 1.3, 0x8a8d93, 14, { m: { roughness: 1 } }); fuzz.rotation.z = Math.PI / 2; g.add(fuzz);
  for (const x of [-0.65, 0.65]) { const cap = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 8), M(0x8a8d93, { roughness: 1 })); cap.position.x = x; g.add(cap); }
  g.add(box(0.12, 0.5, 0.12, 0x333333, 0.2, 0.4, 0));
  return g;
}
function lightStand(color = 0xfff4d6) {
  const g = new THREE.Group();
  for (let k = 0; k < 3; k++) { const a = k / 3 * Math.PI * 2; g.add(stick(V(0, 1.2, 0), V(Math.cos(a) * 1.0, 0, Math.sin(a) * 1.0), 0.06, 0x333333)); }
  g.add(cyl(0.08, 0.08, 5.2, 0x333333, 8)); g.children[g.children.length - 1].position.y = 3.2;
  const head = box(1.6, 1.3, 0.9, 0x222222, 0, 6.0, 0); g.add(head);
  g.add(box(1.4, 1.1, 0.1, color, 0, 6.0, 0.47, { m: { emissive: color, emissiveIntensity: 1.6 } }));
  return g;
}
// spec: { boom: [x, y, z, side, rise], cams: [[x, y, z, aimX, aimZ]], lights: [[x, y, z, aimX, aimZ]] }
function addCrew(root, spec) {
  const aim = (o, x, z, ax, az) => { o.rotation.y = Math.atan2(ax - x, az - z); };
  for (const [x, y, z, ax, az] of spec.cams || []) { const c = filmCam(); c.position.set(x, y, z); aim(c, x, z, ax, az); root.add(c); }
  for (const [x, y, z, ax, az] of spec.lights || []) { const l = lightStand(); l.position.set(x, y, z); aim(l, x, z, ax, az); root.add(l); }
  if (spec.boom) {
    const [x, y, z, side = 1, rise = 0.55] = spec.boom; const bg = new THREE.Group(); bg.position.set(x, y, z);
    const mic = boomMic(); bg.add(mic);
    const dir = V(side * Math.cos(rise), Math.sin(rise), -0.15).normalize();
    bg.add(stick(V(0, 0.6, 0), dir.clone().multiplyScalar(18).add(V(0, 0.6, 0)), 0.07, 0x9aa0a8));
    mic.rotation.y = side > 0 ? 0 : Math.PI; root.add(bg); root.boomG = bg; bg.base = bg.position.clone();
  }
}
function withCrew(fn, spec) { return () => { const sh = fn(); addCrew(sh.root, spec); const up = sh.update; sh.update = (t, u, T) => { up(t, u, T); const b = sh.root.boomG; if (b) { b.position.y = b.base.y + Math.sin(t * 2.1) * 0.08; b.position.x = b.base.x + Math.sin(t * 1.3) * 0.1; } }; return sh; }; }
const CREW = {
  0: { cams: [[-12, 0, -3.6, -16, -8], [12.5, 0, -3.6, 16, -8]] },
  1: { boom: [13.5, 7.9, 6.6, 1, 0.6], cams: [[10.8, 0, 9.8, 13, 6.2]] },
  2: { boom: [0.3, 7.6, -7.6, 1, 0.5], cams: [[-2.3, 0, 0.2, -1.5, -8.5], [2.0, 0, 1.2, 1.5, -8.5]], lights: [[-7.2, 0, -3.5, 0, -8.5]] },
  3: { boom: [0.3, 7.7, 0.5, -1, 0.6], cams: [[2.0, 0, 3.4, 0, 0]], lights: [[-3.4, 0, 2.6, 0, 0]] },
  4: { boom: [0.2, 5.4, 0.5, 1, 0.6] },
  5: { boom: [1.4, 5.0, -0.2, 1, 0.5], cams: [[2.4, 1.2, 2.2, 0, -0.5]], lights: [[-3.8, 1.2, 2.5, 0, -0.5]] },
  6: { boom: [0.5, 8.0, 1.5, 1, 0.5], cams: [[-1.8, 1.2, 4.6, 0, 1]] },
  9: { boom: [0.2, 8.3, 1.2, 1, 0.45], cams: [[3.8, 1.2, 5.0, 0, 1]], lights: [[-4.4, 1.2, 4.0, 0, 1]] },
  12: { boom: [0.3, 7.2, 0.5, 1, 0.6], cams: [[2.6, 0, 3.6, 0, 0]] },
  13: { boom: [0.2, 7.6, 0.5, -1, 0.6] },
  14: { boom: [0.3, 7.0, 0.5, -1, 0.6], cams: [[-2.8, 0, 3.8, 0, 0]] },
  15: { boom: [0.9, 5.6, 0.9, 1, 0.5], cams: [[3.6, 1.2, 3.6, 0.5, 0.6]] },
  19: { boom: [0, 8.4, 2.2, 1, 0.5], cams: [[4.8, 0, 7.0, 0, 2]], lights: [[-5.2, 0, 6.0, 0, 2]] },
  24: { boom: [0.4, 7.5, 3.9, 1, 0.6] },
  25: { boom: [-0.2, 7.4, 6.9, -1, 0.6] },
  26: { boom: [0.3, 5.4, 6.3, 1, 0.55], cams: [[-3.0, 0, 9.0, 0, 6]] },
  31: { boom: [0, 8.6, 2.4, 1, 0.5], cams: [[-6.4, 0, 6.5, 0, 2], [6.4, 0, 6.5, 0, 2]], lights: [[-9.5, 0, 4.0, 0, 2], [9.5, 0, 4.0, 0, 2]] },
};
for (const [k, sp] of Object.entries(CREW)) B[k] = withCrew(B[k], sp);

// ---------- caption overlay ----------
const capEl = document.getElementById('cap'), whoEl = document.getElementById('who'), lineEl = document.getElementById('line'), flashEl = document.getElementById('flash'), titleEl = document.getElementById('title');
const WHO_COL = { 'ROB': '#5b5f73', 'ROB #7': '#5b5f73', 'GRANDMA BEV': '#7a4fd0', 'REAL ROB': '#8a8f99', 'LINDA': '#ff4fa3' };
let capShot = -1, wordSpans = [];
function captions(si, T) {
  const s = DATA.shots[si];
  if (si !== capShot) {
    capShot = si; lineEl.innerHTML = ''; wordSpans = s.text.split(/\s+/).map(w => { const e = document.createElement('span'); e.className = 'w'; e.textContent = w; lineEl.appendChild(e); lineEl.appendChild(document.createTextNode(' ')); return e; });
    if (s.who) { whoEl.style.display = 'inline-block'; whoEl.textContent = s.who; whoEl.style.background = WHO_COL[s.who] || '#333'; } else whoEl.style.display = 'none';
  }
  const wt = wordTimes(s);
  wordSpans.forEach((e, i) => { const a = T - wt[i]; if (a < 0) { e.className = 'w hid'; e.style.transform = ''; } else { e.className = 'w'; const k = easeOutBack(clamp(a / 0.16)); e.style.transform = `scale(${0.4 + 0.6 * k}) translateY(${(1 - k) * 20}px)`; } });
  const out = clamp((s.t1 - T) / 0.12); capEl.style.opacity = si === DATA.shots.length - 1 ? clamp((89.4 - T) / 0.5) : out;
  whoEl.style.transform = `scale(${easeOutBack(clamp((T - s.t0) / 0.2))})`;
}

// ---------- frame driver ----------
let curShot = -1, cur = null;
function shotAt(T) { for (let i = DATA.shots.length - 1; i >= 0; i--) if (T >= DATA.shots[i].t0) return i; return 0; }
window.renderFrame = (f) => {
  const T = f / FPS; const si = shotAt(T); const s = DATA.shots[si];
  if (si !== curShot) { if (cur) scene.remove(cur.root); cur = B[si](); scene.add(cur.root); curShot = si; cur.sp = lights(cur.light); }
  const lt = T - s.t0, u = lt / (s.t1 - s.t0);
  cur.update(lt, u, T);
  const c = cur.cam(lt, u); camera.position.copy(c.p); camera.lookAt(c.l); camera.fov = c.fov; camera.updateProjectionMatrix();
  aimSun(cur.sp, c.l);
  renderer.render(scene, camera);
  captions(si, T);
  // flash for boom & door
  let fl = 0; if (T >= 80 && T < 80.6) fl = 1 - (T - 80) / 0.6; if (T >= 20 && T < 20.25) fl = Math.max(fl, 0.6 * (1 - (T - 20) / 0.25));
  flashEl.style.opacity = fl;
  titleEl.style.opacity = clamp((T - 88.2) / 0.4); titleEl.style.transform = `scale(${0.6 + 0.4 * easeOutBack(clamp((T - 88.2) / 0.5))})`;
  return si;
};
window.FRAMES = Math.round(DATA.duration * FPS);
window.READY = true;
