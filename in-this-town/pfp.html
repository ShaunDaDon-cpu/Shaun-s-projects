<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Avatar PFP</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const S = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 500);

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const tex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, ...o });
function box(w, h, d, m, x = 0, y = 0, z = 0, r = 0.08) { const g = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2.01, h / 2.01, d / 2.01)), m); g.position.set(x, y, z); g.castShadow = g.receiveShadow = true; return g; }

// ---------- background ----------
scene.background = tex(4, 512, (g) => { const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, '#1b0b3a'); gr.addColorStop(0.55, '#6b1f7a'); gr.addColorStop(1, '#ff5fa2'); g.fillStyle = gr; g.fillRect(0, 0, 4, 512); });
const sky = new THREE.Group(); scene.add(sky);
{ const r = rng(5); const dark = mat(0x2a1240, { roughness: 0.9 }); const lit = new THREE.MeshBasicMaterial({ color: 0xffd6f0, toneMapped: false });
  for (let i = 0; i < 26; i++) { const w = 2 + r() * 3, h = 4 + r() * 14, x = -26 + i * 2.1 + r(); const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 2), dark); b.position.set(x, h / 2 - 6, -30 - r() * 6); sky.add(b);
    for (let k = 0; k < 6; k++) if (r() < 0.6) { const wnd = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.45), lit); wnd.position.set(x + (r() - 0.5) * (w - 0.8), -6 + 1 + r() * (h - 2), b.position.z + 1.01); sky.add(wnd); } } }
const halo = new THREE.Mesh(new THREE.CircleGeometry(5.2, 64), new THREE.MeshBasicMaterial({ color: 0xffb3e1, transparent: true, opacity: 0.35, toneMapped: false })); halo.position.set(0, 4.9, -8); scene.add(halo);
const halo2 = new THREE.Mesh(new THREE.RingGeometry(5.6, 5.85, 96), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, toneMapped: false })); halo2.position.copy(halo.position); scene.add(halo2);
{ const r = rng(11); const sp = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }); for (let i = 0; i < 70; i++) { const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.05 + r() * 0.09), sp); s.position.set((r() - 0.5) * 18, r() * 12 - 1, -6 - r() * 10); scene.add(s); } }

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffe6f4, 0x40204a, 1.25));
const key = new THREE.DirectionalLight(0xfff1e6, 2.6); key.position.set(4, 8, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; scene.add(key);
const rimL = new THREE.DirectionalLight(0xff4fb0, 2.2); rimL.position.set(-6, 5, -5); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0x7ab8ff, 1.6); rimR.position.set(6, 4, -5); scene.add(rimR);

// ---------- character ----------
const SKIN = 0xb9763f;
const skin = mat(SKIN, { roughness: 0.55 });
const ch = new THREE.Group(); scene.add(ch);
const body = new THREE.Group(); ch.add(body);

// tank top (white, ribbed) with skin showing at the neckline
const tankTex = tex(256, 256, (g) => { g.fillStyle = '#f3f3f1'; g.fillRect(0, 0, 256, 256); g.fillStyle = 'rgba(0,0,0,0.05)'; for (let x = 0; x < 256; x += 8) g.fillRect(x, 0, 3, 256); g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(0, 230, 256, 26); });
const tank = mat(0xffffff, { map: tankTex, roughness: 0.85 });
const tankFront = tex(256, 256, (g) => { g.fillStyle = '#b9763f'; g.fillRect(0, 0, 256, 256); g.fillStyle = '#f3f3f1';
  g.beginPath(); g.moveTo(56, 0); g.lineTo(88, 0); g.quadraticCurveTo(128, 76, 168, 0); g.lineTo(200, 0); g.quadraticCurveTo(212, 44, 256, 60); g.lineTo(256, 256); g.lineTo(0, 256); g.lineTo(0, 60); g.quadraticCurveTo(44, 44, 56, 0); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.05)'; for (let x = 0; x < 256; x += 8) g.fillRect(x, 50, 3, 206); g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(0, 232, 256, 24); });
const tankM = new THREE.MeshStandardMaterial({ map: tankFront, roughness: 0.85 });
const torso = new THREE.Mesh(new RoundedBoxGeometry(2, 2, 1, 3, 0.08), [tank, tank, skin, tank, tankM, tankM]); torso.position.y = 3; torso.castShadow = torso.receiveShadow = true; body.add(torso);
// arms (bare)
const arms = [];
for (const sx of [1, -1]) { const p = new THREE.Group(); p.position.set(1.5 * sx, 4, 0); p.add(box(1, 2, 1, skin, 0, -1, 0, 0.14)); body.add(p); arms.push(p); }
// legs (dark joggers)
const pants = mat(0x26272c, { roughness: 0.9 });
for (const sx of [1, -1]) { const p = new THREE.Group(); p.position.set(0.5 * sx, 2, 0); p.add(box(1, 1.7, 1, pants, 0, -0.85, 0, 0.1)); p.add(box(1.04, 0.35, 1.06, mat(0xf3b2c8, { roughness: 1 }), 0, -1.82, 0.06, 0.12)); body.add(p); }
body.add(box(2.02, 0.3, 1.02, mat(0x3b4bb0, { roughness: 0.9 }), 0, 2.05, 0, 0.04)); // waistband peeking out
// crossbody strap + bag
const strapM = mat(0x13261f, { roughness: 0.8 });
const strap = box(0.22, 2.9, 0.08, strapM, 0.1, 3.0, 0.53, 0.03); strap.rotation.z = -0.62; body.add(strap);
const strapB = box(0.22, 2.9, 0.08, strapM, 0.1, 3.0, -0.53, 0.03); strapB.rotation.z = 0.62; body.add(strapB);
body.add(box(0.5, 1.3, 1.0, strapM, -1.15, 2.4, -0.1, 0.12));
body.add(box(0.1, 0.12, 0.3, mat(0xb0b4ba, { metalness: 0.8, roughness: 0.3 }), -0.55, 2.55, 0.56, 0.02));

// head
const neck = new THREE.Group(); neck.position.set(0, 4, 0); body.add(neck);
neck.add(box(1.22, 1.22, 1.22, skin, 0, 0.62, 0, 0.26));
// face: half-lidded eye, small frown, glitter patch over the right half
const faceTex = tex(512, 512, (g) => {
  const r = rng(3);
  g.lineCap = 'round'; g.lineJoin = 'round';
  // glitter patch (character's left = image right)
  g.save(); g.beginPath(); g.moveTo(280, 40); g.lineTo(400, 60); g.lineTo(420, 180); g.lineTo(450, 300); g.lineTo(405, 360); g.lineTo(420, 470); g.lineTo(300, 480); g.lineTo(320, 380); g.lineTo(268, 300); g.lineTo(300, 220); g.lineTo(262, 130); g.closePath(); g.clip();
  g.fillStyle = '#eeeef2'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++) { const v = 150 + r() * 105; g.fillStyle = `rgb(${v},${v},${v + 8})`; g.fillRect(250 + r() * 220, 30 + r() * 460, 3 + r() * 4, 3 + r() * 4); }
  for (let i = 0; i < 70; i++) { g.fillStyle = '#ffffff'; g.fillRect(250 + r() * 220, 30 + r() * 460, 5, 5); }
  g.restore();
  g.strokeStyle = 'rgba(60,60,70,0.55)'; g.lineWidth = 5; g.beginPath(); g.moveTo(280, 40); g.lineTo(262, 130); g.lineTo(300, 220); g.lineTo(268, 300); g.lineTo(320, 380); g.lineTo(300, 480); g.stroke();
  // visible eye (half-lidded) + brow
  g.fillStyle = '#1b1210'; g.save(); g.beginPath(); g.rect(130, 228, 110, 70); g.clip(); g.beginPath(); g.ellipse(186, 236, 34, 26, 0, 0, 7); g.fill(); g.restore();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(176, 244, 6, 0, 7); g.fill();
  g.strokeStyle = '#1b1210'; g.lineWidth = 12; g.beginPath(); g.moveTo(140, 226); g.quadraticCurveTo(190, 214, 238, 226); g.stroke();
  g.lineWidth = 11; g.beginPath(); g.moveTo(140, 176); g.lineTo(232, 190); g.stroke();
  g.lineWidth = 10; g.beginPath(); g.moveTo(170, 380); g.quadraticCurveTo(215, 368, 262, 382); g.stroke();
});
const face = new THREE.Mesh(new THREE.PlaneGeometry(1.14, 1.14), new THREE.MeshStandardMaterial({ map: faceTex, transparent: true, roughness: 0.5, depthWrite: false })); face.position.set(0, 0.62, 0.612); neck.add(face);

// cap (black, flat brim, white graphic)
const capM = mat(0x121214, { roughness: 0.75 });
const capTex = tex(512, 256, (g) => { g.fillStyle = '#121214'; g.fillRect(0, 0, 512, 256); g.strokeStyle = '#f2f2f2'; g.fillStyle = '#f2f2f2'; g.lineWidth = 6;
  g.strokeRect(40, 60, 432, 130); g.font = '700 96px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('✦ 𝔇 ✦', 256, 128);
  for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(70 + i * 46, 220, 5, 0, 7); g.fill(); } });
const crown = new THREE.Mesh(new RoundedBoxGeometry(1.34, 0.62, 1.34, 4, 0.28), [capM, capM, capM, capM, mat(0xffffff, { map: capTex, roughness: 0.7 }), capM]); crown.position.set(0, 1.36, 0); crown.castShadow = true; neck.add(crown);
neck.add(box(0.2, 0.08, 0.2, capM, 0, 1.68, 0, 0.04));
const brim = box(1.38, 0.08, 0.85, capM, 0, 1.13, 0.82, 0.04); brim.rotation.x = 0.1; neck.add(brim);
const brimUnder = box(1.32, 0.02, 0.8, mat(0x2f6b3a, { roughness: 0.9 }), 0, 1.085, 0.82, 0.01); brimUnder.rotation.x = 0.1; neck.add(brimUnder);

// skeleton hands gripping the face
const bone = mat(0xd9dce2, { metalness: 0.55, roughness: 0.32 });
function boneHand(side) {
  const h = new THREE.Group();
  const seg = (len, w) => { const g = new THREE.Group(); const m = box(w, len, w, bone, 0, -len / 2, 0, w * 0.45); g.add(m); const k = new THREE.Mesh(new THREE.SphereGeometry(w * 0.62, 12, 8), bone); k.castShadow = true; g.add(k); return g; };
  h.add(box(0.48, 0.3, 0.1, bone, 0, 0, 0, 0.04)); for (let i = 0; i < 4; i++) { const mc = box(0.06, 0.32, 0.06, bone, -0.19 + i * 0.13, -0.12, 0.05, 0.03); h.add(mc); }
  for (let i = 0; i < 4; i++) {
    const f = new THREE.Group(); f.position.set(-0.19 + i * 0.13, -0.3, 0); h.add(f);
    const a = seg(0.34 - Math.abs(i - 1.5) * 0.04, 0.075); f.add(a); a.rotation.x = 0.35;
    const b = seg(0.26, 0.065); b.position.y = -0.31; a.add(b); b.rotation.x = 0.7;
    const c = seg(0.16, 0.055); c.position.y = -0.24; b.add(c); c.rotation.x = 0.6;
  }
  const th = seg(0.3, 0.08); th.position.set(0.28 * side, -0.05, 0.02); th.rotation.z = -0.9 * side; th.rotation.x = 0.3; h.add(th);
  return h;
}
const hL = boneHand(1); hL.position.set(-0.5, 1.02, 0.7); hL.rotation.set(-0.1, 0, 0.62); hL.scale.setScalar(0.85); neck.add(hL);
const hR = boneHand(-1); hR.position.set(0.38, 0.98, 0.72); hR.rotation.set(-0.1, 0, -0.42); hR.scale.setScalar(0.85); neck.add(hR);

// pose: a little attitude
ch.rotation.y = -0.32;
neck.rotation.set(0.04, 0.12, -0.05);
arms[0].rotation.set(0.05, 0, 0.08); arms[1].rotation.set(-0.1, 0, -0.1);

// floor glow for grounding
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshStandardMaterial({ color: 0x3a1650, roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

camera.position.set(0.6, 5.2, 7.0); camera.lookAt(0, 4.6, 0);
key.target.position.set(0, 4, 0); scene.add(key.target);
renderer.render(scene, camera);
window.READY = true;
</script>
</body>
</html>
